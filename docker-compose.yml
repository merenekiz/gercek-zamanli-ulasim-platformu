version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:15-3.4-alpine
    platform: linux/amd64
    container_name: gercek-zamanli-ulasim-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password not set. Set POSTGRES_PASSWORD environment variable.}
      POSTGRES_DB: ${POSTGRES_DB:-gercek_zamanli_ulasim_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gercek-zamanli-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulasim_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    platform: linux/arm64
    container_name: gercek-zamanli-ulasim-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MongoDB password not set. Set MONGO_INITDB_ROOT_PASSWORD environment variable.}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-gercek_zamanli_ulasim_realtime}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - gercek-zamanli-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/gercek_zamanli_ulasim_realtime --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: gercek-zamanli-ulasim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gercek-zamanli-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gercek-zamanli-ulasim-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5001}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password not set.}
      POSTGRES_DB: ${POSTGRES_DB:-gercek_zamanli_ulasim_db}
      MONGODB_URI: ${MONGODB_URI:?MongoDB URI not set. Set MONGODB_URI environment variable.}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set. Set JWT_SECRET environment variable.}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?Google Maps API key not set. Set GOOGLE_MAPS_API_KEY environment variable.}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gercek-zamanli-network
    command: npm run start

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api/v1}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?Google Maps API key not set.}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5001}
    container_name: gercek-zamanli-ulasim-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api/v1}
      API_URL: ${API_URL:-http://backend:5001/api/v1}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?Google Maps API key not set.}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gercek-zamanli-network
    command: node server.js

networks:
  gercek-zamanli-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
