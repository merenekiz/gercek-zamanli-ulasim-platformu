version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: gercek-zamanli-ulasim-postgres
    environment:
      POSTGRES_USER: ulasim_admin
      POSTGRES_PASSWORD: ulasim_password_2024
      POSTGRES_DB: gercek_zamanli_ulasim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gercek-zamanli-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulasim_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: gercek-zamanli-ulasim-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ulasim_admin
      MONGO_INITDB_ROOT_PASSWORD: ulasim_password_2024
      MONGO_INITDB_DATABASE: gercek_zamanli_ulasim_realtime
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - gercek-zamanli-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/gercek_zamanli_ulasim_realtime --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gercek-zamanli-ulasim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gercek-zamanli-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gercek-zamanli-ulasim-backend
    environment:
      NODE_ENV: development
      PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ulasim_admin
      POSTGRES_PASSWORD: ulasim_password_2024
      POSTGRES_DB: gercek_zamanli_ulasim_db
      MONGODB_URI: mongodb://ulasim_admin:ulasim_password_2024@mongodb:27017/gercek_zamanli_ulasim_realtime?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: gercek_zamanli_ulasim_jwt_secret_2024_change_in_production
      JWT_EXPIRE: 7d
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gercek-zamanli-network
    command: npm run start

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyAAuuEtefrQhdDrGR5RjwB_3nTX0lnJIZ8
        NEXT_PUBLIC_WS_URL: ws://localhost:5001
    container_name: gercek-zamanli-ulasim-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
      API_URL: http://backend:5001/api/v1
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyAAuuEtefrQhdDrGR5RjwB_3nTX0lnJIZ8
      NEXT_PUBLIC_WS_URL: ws://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gercek-zamanli-network
    command: node server.js

networks:
  gercek-zamanli-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
